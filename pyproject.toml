[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "backpacking"
version = "1.0.0"
description = "Itinerary, permit and resupply logistics for long-distance trail corridors"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "glinskevxer", email = "roym78109@gmail.com" }]
dependencies = [
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
]

[project.optional-dependencies]
api = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
]
db = [
    "SQLAlchemy==2.0.52",
    "alembic==1.19.1",
]
cli = [
    "typer==0.27.1",
    # typer 0.15 predates the click 8.2 signature change in make_metavar.
    "click==8.4.2",
]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "hypothesis==6.123.2",
    "freezegun==1.5.1",
    "httpx==0.28.1",
    "ruff==0.8.6",
    "mypy==1.14.1",
]

[project.scripts]
backpacking = "backpacking.cli.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/backpacking"]

[tool.hatch.build.targets.wheel.force-include]
"src/backpacking/py.typed" = "backpacking/py.typed"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
markers = [
    "slow: takes more than a second to run",
    "benchmark: measures how long something takes rather than what it returns",
]
filterwarnings = [
    "error",
    # SQLAlchemy emits this on SQLite when a savepoint is rolled back inside a
    # nested transaction, which the session scope does deliberately.
    "default::ResourceWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = [
    # FastAPI dependency injection is written as a call in a default argument.
    "B008",
    # Every dataclass default in this project is a frozen quantity such as
    # Mass.pounds(25.0). They are immutable and shared safely, so the mutable
    # default the rule guards against cannot occur here.
    "RUF009",
]

[tool.ruff.lint.per-file-ignores]
# Tests read better with long, explicit assertion lines than with wrapped ones.
"tests/*" = ["E501"]

[tool.coverage.run]
source = ["backpacking"]
branch = true
omit = [
    # The uvicorn entry point is one line and cannot be exercised in process.
    "src/backpacking/api/main.py",
]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["backpacking"]
strict = true
warn_unreachable = true

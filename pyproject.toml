[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "backpacking"
version = "0.1.0"
description = "Itinerary, permit and resupply logistics for long-distance trail corridors"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "glinskevxer", email = "roym78109@gmail.com" }]
dependencies = [
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
]

[project.optional-dependencies]
api = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
]
db = [
    "SQLAlchemy==2.0.36",
    "alembic==1.14.0",
]
cli = [
    "typer==0.15.1",
]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "hypothesis==6.123.2",
    "freezegun==1.5.1",
    "httpx==0.28.1",
    "ruff==0.8.6",
    "mypy==1.14.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/backpacking"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "slow: takes more than a second to run",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["backpacking"]
strict = true
warn_unreachable = true

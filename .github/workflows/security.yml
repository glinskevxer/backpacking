name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published advisory against a pinned dependency shows up
    # without waiting for someone to open a pull request.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install -e ".[api,db,cli]"
          python -m pip install "pip-audit==2.7.3"

      - name: Audit the installed set
        # This project is installed from the checkout and has no PyPI record, so
        # it is skipped. --strict is deliberately absent: it fails on any
        # dependency that cannot be collected, and the skipped local package is
        # exactly that, so it turned an empty audit into a red build.
        #
        # The accepted advisories below are the price of pinning the runtime to
        # early 2025 on purpose. Each is listed by id rather than suppressed
        # wholesale, so a NEW advisory against any pin still fails this job.
        # Reviewed 2026-08-24. Revisit whenever a pin moves.
        #
        #   click     8.1.8  PYSEC-2026-2132                fixed in 8.3.3
        #   pytest    8.3.4  PYSEC-2026-1845                fixed in 9.0.3
        #   starlette 0.41.3 seven advisories, arrives via fastapi 0.115.6,
        #                    so it cannot move without moving fastapi
        run: |
          pip-audit --skip-editable --progress-spinner off \
            --ignore-vuln PYSEC-2026-2132 \
            --ignore-vuln PYSEC-2026-1845 \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln PYSEC-2026-1941 \
            --ignore-vuln PYSEC-2026-1942 \
            --ignore-vuln PYSEC-2026-2280 \
            --ignore-vuln PYSEC-2026-2281 \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-249

  secrets:
    name: no credentials in the tree
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan the working tree
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          # Deliberately narrow. A broad scanner produces noise nobody reads,
          # and the point is to catch the two mistakes that actually happen:
          # a pasted key and a hardcoded connection string with a password.
          PATTERNS = {
              "aws access key": re.compile(r"AKIA[0-9A-Z]{16}"),
              "private key block": re.compile(r"-----BEGIN [A-Z ]*PRIVATE KEY-----"),
              "github token": re.compile(r"gh[pousr]_[A-Za-z0-9]{36,}"),
              "url with password": re.compile(
                  r"(?:postgres|postgresql|mysql|redis|amqp)(?:\+\w+)?://[^\s:/]+:[^\s@/]+@"
              ),
          }
          ALLOWED = {"backpacking:backpacking@"}
          SKIP_DIRS = {".git", ".venv", "node_modules", "__pycache__"}

          root = pathlib.Path(".")
          problems = []
          for path in root.rglob("*"):
              if not path.is_file() or any(part in SKIP_DIRS for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              for label, pattern in PATTERNS.items():
                  for match in pattern.finditer(text):
                      if any(allowed in match.group(0) for allowed in ALLOWED):
                          continue
                      line = text[: match.start()].count("\n") + 1
                      problems.append(f"{path}:{line}: possible {label}")

          if problems:
              print("\n".join(problems), file=sys.stderr)
              sys.exit(1)
          print("no credentials found")
          PY
